name: Feature request
description: A task Inklight should handle, or a better way to handle one
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task in your own words
      description: What you would type to Inklight, e.g. "List every invoice paid late and how late".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
  - type: textarea
    id: documents
    attributes:
      label: What kind of documents
      description: Invoices, contracts, forms, reports, language, scans or digital PDFs, typical page count.
