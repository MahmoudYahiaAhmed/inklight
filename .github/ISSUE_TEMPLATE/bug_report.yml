name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **do not attach confidential documents**. A synthetic file that shows
        the problem is ideal (`python tests/factory.py` generates some). Security issues: see SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command or Python code, and the kind of document (digital PDF, scan, photo).
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `inklight doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Error output or `--trace` / `--json` result
      render: text
