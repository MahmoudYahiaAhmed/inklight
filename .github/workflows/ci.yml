name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/inklight
            ~/.cache/huggingface
          key: models-${{ runner.os }}-ocr-bd02167
      - run: pip install -e ".[dev]"
      - run: pytest --cov=inklight --cov-report=term --cov-fail-under=80

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check the distributions hold only runtime files and record this commit
        run: python .github/scripts/check_dist.py dist --commit "$GITHUB_SHA"
      - name: Build a wheel from the sdist; it keeps the commit
        run: |
          pip wheel --no-deps -w /tmp/from-sdist dist/*.tar.gz
          cp dist/*.tar.gz /tmp/from-sdist/
          python .github/scripts/check_dist.py /tmp/from-sdist --commit "$GITHUB_SHA"
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/inklight --version
          /tmp/clean/bin/inklight doctor
          /tmp/clean/bin/inklight --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
