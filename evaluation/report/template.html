<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inklight 0.3 technical report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fcfcfb; --ink:#17181a; --ink-2:#4c4e53; --ink-3:#7c7e83; --rule:#e4e4e1; --panel:#f4f4f1;
  --accent:#0a8fb0; --accent-soft:#e6f5f9; --code:#f1f1ee;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --arabic:"Noto Naskh Arabic","Geeza Pro","Segoe UI",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181a; --ink:#ecedea; --ink-2:#b9bab4; --ink-3:#8e8f8a; --rule:#2c2d2f; --panel:#1f2022;
  --accent:#22b8d8; --accent-soft:#0d2f38; --code:#202124;}}
:root[data-theme="dark"]{--bg:#17181a; --ink:#ecedea; --ink-2:#b9bab4; --ink-3:#8e8f8a; --rule:#2c2d2f; --panel:#1f2022;
  --accent:#22b8d8; --accent-soft:#0d2f38; --code:#202124;}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.62 var(--serif);font-feature-settings:"onum" 0,"tnum" 1;
  -webkit-font-smoothing:antialiased}
main{max-width:780px;margin:0 auto;padding:72px 16px 96px}
h1{font:600 40px/1.12 var(--sans);letter-spacing:-.02em;margin:0 0 20px}
h1::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--accent);margin-bottom:28px}
h2{font:600 24px/1.25 var(--sans);letter-spacing:-.01em;margin:64px 0 14px;padding-top:20px;border-top:1px solid var(--rule)}
h3{font:600 18px/1.35 var(--sans);margin:40px 0 10px}
p,li{color:var(--ink)}
strong{font-weight:600}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
ul,ol{padding-left:22px}
li{margin:4px 0}
em{color:var(--ink-2)}
p>em:only-child{display:block;font:13.5px/1.55 var(--sans);font-style:normal;color:var(--ink-2);margin:-4px 0 30px}
code{font:13.5px/1.5 ui-monospace,"SF Mono",Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px}
pre{background:var(--code);padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:13px}
pre code{padding:0;background:none}
blockquote{margin:24px 0;padding:14px 18px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
blockquote p{margin:0;font-size:15.5px}
table{width:100%;border-collapse:collapse;margin:18px 0 26px;font:13.5px/1.45 var(--sans);font-variant-numeric:tabular-nums;
  display:block;overflow-x:auto}
th{text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1.5px solid var(--ink-3);padding:8px 10px 7px;vertical-align:bottom}
td{border-bottom:1px solid var(--rule);padding:8px 10px;vertical-align:top}
tr:last-child td{border-bottom:none}
table:has(th:nth-child(6)){width:min(1120px,calc(100vw - 32px));position:relative;left:50%;transform:translateX(-50%);font-size:13px}
table:has(th:nth-child(6)) td:first-child,table:has(th:nth-child(6)) th:first-child{font-weight:600;color:var(--ink-2);min-width:96px}
.fig{display:block;margin:26px -8px 8px;overflow-x:auto}
.fig svg{max-width:100%;height:auto;display:block}
img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:8px;background:#fff;display:block;margin:16px 0}
:lang(ar),[dir=rtl]{font-family:var(--arabic)}
p:first-of-type strong:first-child{font-family:var(--sans)}
main>p:first-of-type{font:14px/1.6 var(--sans);color:var(--ink-2)}
.toolbar{position:fixed;top:14px;right:16px;font:12px var(--sans)}
.toolbar button{font:inherit;color:var(--ink-2);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer}
.toolbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){body{font-size:16px}h1{font-size:30px}main{padding-top:56px}.fig{margin:20px 0}}
@media print{
  :root{--bg:#fff;--ink:#000;--ink-2:#333;--ink-3:#666;--rule:#ccc;--code:#f3f3f3;--accent:#0a6f8a;--accent-soft:#eef7fa}
  .toolbar{display:none} main{max-width:none;padding:0} body{font-size:11pt}
  h2{break-before:page;border-top:none;margin-top:0}
  .fig,img,table,pre,blockquote{break-inside:avoid}
  a{color:inherit;text-decoration:none}
  @page{margin:18mm 16mm}
}
</style>
</head>
<body>
<div class="toolbar"><button type="button" onclick="window.print()">Print or save as PDF</button></div>
<main>
{{body}}
</main>
</body>
</html>
