ed 18 of 120</title></rect><text class="t1" x="727.0" y="97" font-size="12" text-anchor="middle" font-weight="600">18</text><text class="t1" x="198" y="131" font-size="13" text-anchor="end">CORD holdout</text><text class="t3" x="198" y="145" font-size="11" text-anchor="end">genuine receipt photos · n = 124</text><rect class="c-ok" x="210.0" y="120" width="282.5" height="22" rx="3"><title>CORD holdout: Correct 63 of 124</title></rect><text class="bg" x="351.3" y="135" font-size="12" text-anchor="middle" font-weight="600">63</text><rect class="c-okf" x="494.5" y="120" width="97.4" height="22" rx="3"><title>CORD holdout: Correct, flagged for review 22 of 124</title></rect><text class="t1" x="543.2" y="135" font-size="12" text-anchor="middle" font-weight="600">22</text><rect class="c-wf" x="593.9" y="120" width="65.7" height="22" rx="3"><title>CORD holdout: Wrong, flagged for review 15 of 124</title></rect><text class="t1" x="626.7" y="135" font-size="12" text-anchor="middle" font-weight="600">15</text><rect class="c-miss" x="661.6" y="120" width="106.4" height="22" rx="3"><title>CORD holdout: Missing / declined 24 of 124</title></rect><text class="t1" x="714.8" y="135" font-size="12" text-anchor="middle" font-weight="600">24</text><text class="t1" x="198" y="169" font-size="13" text-anchor="end">Voxel51 dev</text><text class="t3" x="198" y="183" font-size="11" text-anchor="end">synthetic invoice images · n = 360</text><rect class="c-ok" x="210.0" y="158" width="519.1" height="22" rx="3"><title>Voxel51 dev: Correct 335 of 360</title></rect><text class="bg" x="469.6" y="173" font-size="12" text-anchor="middle" font-weight="600">335</text><rect class="c-okf" x="731.1" y="158" width="33.8" height="22" rx="3"><title>Voxel51 dev: Correct, flagged for review 23 of 360</title></rect><text class="t1" x="748.0" y="173" font-size="12" text-anchor="middle" font-weight="600">23</text><rect class="c-wf" x="766.9" y="158" width="1.0" height="22" rx="3"><title>Voxel51 dev: Wrong, flagged for review 1 of 360</title></rect><rect class="c-sw" x="768.4" y="158" width="1.0" height="22" rx="3"><title>Voxel51 dev: Wrong, not flagged (silent) 1 of 360</title></rect><text class="t1" x="198" y="207" font-size="13" text-anchor="end">Voxel51 holdout</text><text class="t3" x="198" y="221" font-size="11" text-anchor="end">synthetic invoice images · n = 360</text><rect class="c-ok" x="210.0" y="196" width="509.8" height="22" rx="3"><title>Voxel51 holdout: Correct 329 of 360</title></rect><text class="bg" x="464.9" y="211" font-size="12" text-anchor="middle" font-weight="600">329</text><rect class="c-okf" x="721.8" y="196" width="44.7" height="22" rx="3"><title>Voxel51 holdout: Correct, flagged for review 30 of 360</title></rect><text class="t1" x="744.1" y="211" font-size="12" text-anchor="middle" font-weight="600">30</text><rect class="c-sw" x="768.4" y="196" width="1.0" height="22" rx="3"><title>Voxel51 holdout: Wrong, not flagged (silent) 1 of 360</title></rect><text class="t3" x="20" y="270" font-size="11">Rules mode, CPU, structure off. CORD: total, subtotal, tax. Voxel51: vendor, customer, number, date, tax, total. Flagged = warning or confidence &lt; 0.7.</text></svg>