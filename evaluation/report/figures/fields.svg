<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 288" width="800" height="288" role="img" aria-labelledby="t d"><title id="t">Field extraction on two public datasets, current build</title><desc id="d">Outcome of every annotated value, per split</desc><style>
