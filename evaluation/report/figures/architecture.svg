<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="t d"><title id="t">Inklight architecture</title><desc id="d">Six stages from reading a file to experimental questions</desc><style>
svg{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.t1{fill:#17181a}.t2{fill:#55575c}.t3{fill:#7c7e83}.grid{stroke:#e4e4e1}.axis{stroke:#b9bab6}
.c-ok{fill:#2a78d6}.c-okf{fill:#1baf7a}.c-wf{fill:#eda100}.c-sw{fill:#e34948}.c-miss{fill:url(#hatch)}
.c-acc{fill:#0a8fb0}.c-mut{fill:#c9cac6}.hatch-l{stroke:#9b9c98}.hatch-b{fill:#f1f1ee}.gap{stroke:#fcfcfb}
.box{fill:#fcfcfb;stroke:#c9cac6}.box-acc{fill:#e6f5f9;stroke:#0a8fb0}.line{stroke:#9b9c98}.bg{fill:#fcfcfb}
@media (prefers-color-scheme:dark){
.t1{fill:#ecedea}.t2{fill:#b9bab4}.t3{fill:#8e8f8a}.grid{stroke:#2c2d2f}.axis{stroke:#4a4b4e}
.c-ok{fill:#3987e5}.c-okf{fill:#199e70}.c-wf{fill:#c98500}.c-sw{fill:#d55181}.c-acc{fill:#22b8d8}.c-mut{fill:#4a4b4e}
.hatch-l{stroke:#77786f}.hatch-b{fill:#232426}.gap{stroke:#17181a}.box{fill:#1d1e20;stroke:#3a3b3e}
.box-acc{fill:#0d2f38;stroke:#22b8d8}.line{stroke:#6b6c68}.bg{fill:#17181a}}
@media print{.bg{fill:#fff}}
</style>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect class="hatch-b" width="6" height="6"/><line class="hatch-l" x1="0" y1="0" x2="0" y2="6" stroke-width="2"/></pattern></defs><rect class="bg" width="980" height="300"/><text class="t1" x="20" y="30" font-size="15" font-weight="600">Inklight: one local process, three model sets, deterministic operations</text><rect class="box" x="20.0" y="70" width="146" height="150" rx="10" stroke-width="1.5"/><text class="t1" x="32.0" y="96" font-size="14" font-weight="600">Read</text><text class="t2" x="32.0" y="118" font-size="11.5">PDF text layer ·</text><text class="t2" x="32.0" y="133" font-size="11.5">pypdfium2</text><text class="t3" x="32.0" y="162" font-size="10.5">Pages rendered once; a</text><text class="t3" x="32.0" y="176" font-size="10.5">PDF text layer is</text><text class="t3" x="32.0" y="190" font-size="10.5">checked and used where</text><text class="t3" x="32.0" y="204" font-size="10.5">it is sound</text><line class="line" x1="170.0" y1="145.0" x2="172.8" y2="145.0" stroke-width="1.5"/><path class="c-mut" d="M172.8,141.0 l6,4 l-6,4z"/><rect class="box-acc" x="178.8" y="70" width="146" height="150" rx="10" stroke-width="1.5"/><text class="t1" x="190.8" y="96" font-size="14" font-weight="600">OCR</text><text class="t2" x="190.8" y="118" font-size="11.5">Indra OCR models ·</text><text class="t2" x="190.8" y="133" font-size="11.5">ONNX Runtime</text><text class="t3" x="190.8" y="162" font-size="10.5">Detection, recognition</text><text class="t3" x="190.8" y="176" font-size="10.5">(Latin, Arabic, …),</text><text class="t3" x="190.8" y="190" font-size="10.5">orientation, reading</text><text class="t3" x="190.8" y="204" font-size="10.5">order · ~76 MB</text><line class="line" x1="328.8" y1="145.0" x2="331.6" y2="145.0" stroke-width="1.5"/><path class="c-mut" d="M331.6,141.0 l6,4 l-6,4z"/><rect class="box-acc" x="337.6" y="70" width="146" height="150" rx="10" stroke-width="1.5"/><text class="t1" x="349.6" y="96" font-size="14" font-weight="600">Structure</text><text class="t2" x="349.6" y="118" font-size="11.5">Heron layout (ONNX) ·</text><text class="t2" x="349.6" y="133" font-size="11.5">TableFormer (PyTorch)</text><text class="t3" x="349.6" y="162" font-size="10.5">Optional [structure]</text><text class="t3" x="349.6" y="176" font-size="10.5">extra: regions,</text><text class="t3" x="349.6" y="190" font-size="10.5">tables, cells matched to</text><text class="t3" x="349.6" y="204" font-size="10.5">OCR lines · ~380 MB</text><line class="line" x1="487.6" y1="145.0" x2="490.4" y2="145.0" stroke-width="1.5"/><path class="c-mut" d="M490.4,141.0 l6,4 l-6,4z"/><rect class="box" x="496.4" y="70" width="146" height="150" rx="10" stroke-width="1.5"/><text class="t1" x="508.4" y="96" font-size="14" font-weight="600">Store</text><text class="t2" x="508.4" y="118" font-size="11.5">SQLite library ·</text><text class="t2" x="508.4" y="133" font-size="11.5">full-text index</text><text class="t3" x="508.4" y="162" font-size="10.5">Lines, boxes,</text><text class="t3" x="508.4" y="176" font-size="10.5">confidences, blocks and</text><text class="t3" x="508.4" y="190" font-size="10.5">tables kept per page,</text><text class="t3" x="508.4" y="204" font-size="10.5">with provenance</text><line class="line" x1="646.4" y1="145.0" x2="649.2" y2="145.0" stroke-width="1.5"/><path class="c-mut" d="M649.2,141.0 l6,4 l-6,4z"/><rect class="box" x="655.2" y="70" width="146" height="150" rx="10" stroke-width="1.5"/><text class="t1" x="667.2" y="96" font-size="14" font-weight="600">Operations</text><text class="t2" x="667.2" y="118" font-size="11.5">Rules and label</text><text class="t2" x="667.2" y="133" font-size="11.5">readers</text><text class="t3" x="667.2" y="162" font-size="10.5">Text, tables, fields,</text><text class="t3" x="667.2" y="176" font-size="10.5">search with</text><text class="t3" x="667.2" y="190" font-size="10.5">citations, review and</text><text class="t3" x="667.2" y="204" font-size="10.5">export</text><line class="line" x1="805.2" y1="145.0" x2="808.0" y2="145.0" stroke-width="1.5"/><path class="c-mut" d="M808.0,141.0 l6,4 l-6,4z"/><rect class="box" x="814.0" y="70" width="146" height="150" rx="10" stroke-width="1.5" stroke-dasharray="5 4"/><text class="t1" x="826.0" y="96" font-size="14" font-weight="600">Ask</text><text class="t2" x="826.0" y="118" font-size="11.5">Experimental ·</text><text class="t2" x="826.0" y="133" font-size="11.5">optional small models</text><text class="t3" x="826.0" y="162" font-size="10.5">Questions over the</text><text class="t3" x="826.0" y="176" font-size="10.5">library; Arabic</text><text class="t3" x="826.0" y="190" font-size="10.5">questions skip the</text><text class="t3" x="826.0" y="204" font-size="10.5">English-only models</text><rect class="box-acc" x="20" y="247" width="10" height="10" rx="2"/><text class="t2" x="35" y="256" font-size="12">model inference (CPU)</text><rect class="box" x="187.4" y="247" width="10" height="10" rx="2"/><text class="t2" x="202.4" y="256" font-size="12">deterministic code</text><rect class="c-mut" x="335.6" y="247" width="10" height="10" rx="2"/><text class="t2" x="350.6" y="256" font-size="12">experimental</text><text class="t3" x="20" y="282" font-size="11">No document leaves the machine. Model files are downloaded once at pinned revisions and checked by SHA-256; INKLIGHT_OFFLINE=1 forbids downloads.</text></svg>