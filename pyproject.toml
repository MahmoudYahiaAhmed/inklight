[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inklight"
version = "0.3.1"
description = "A local document workspace for Arabic, English and mixed documents: text, tables, fields, search and review."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.11"
authors = [{ name = "Mahmoud AboEl-Wfa" }]
maintainers = [{ name = "Mahmoud AboEl-Wfa" }]
keywords = ["ocr", "document-ai", "arabic", "pdf", "tables", "extraction", "search", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing :: General",
  "Typing :: Typed",
]
dependencies = [
  # Inklight OCR runs on ONNX Runtime; PDFs are read and rendered with PDFium; images with OpenCV and Pillow.
  "onnxruntime>=1.17",
  "opencv-python-headless>=4.8",
  "pypdfium2>=4.30",
  "pillow>=10",
  "huggingface_hub>=0.23",  # the small models Ask can use (inklight models pull)
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13",
  "tokenizers>=0.19",
  "numpy>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
remote = ["httpx>=0.27"]
# Inklight document structure (layout, reading order, tables) on the OCR's text: PyTorch runs the table model,
# docling-core holds the structured document. docs/STRUCTURE.md
structure = ["torch>=2.2", "torchvision>=0.17", "safetensors>=0.4", "rtree>=1.0", "docling-core>=2.104,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "pymupdf>=1.24", "docling-core>=2.104,<3"]

[project.scripts]
inklight = "inklight.cli:main"

[project.urls]
Homepage = "https://github.com/MahmoudYahiaAhmed/inklight"
Documentation = "https://github.com/MahmoudYahiaAhmed/inklight/tree/main/docs"
Issues = "https://github.com/MahmoudYahiaAhmed/inklight/issues"
Changelog = "https://github.com/MahmoudYahiaAhmed/inklight/blob/main/CHANGELOG.md"
Source = "https://github.com/MahmoudYahiaAhmed/inklight"

[tool.hatch.build.targets.wheel]
packages = ["src/inklight"]

[tool.hatch.build.targets.wheel.hooks.custom]  # hatch_build.py: stamps the source commit into inklight/_build.py

[tool.hatch.build.targets.sdist.hooks.custom]  # ... and into the sdist, so a wheel built from it keeps the commit

# The sdist builds the wheel and nothing else: the tests, their bench/ helpers, docs and examples stay in the repository
# (see CONTRIBUTING.md). .github/scripts/check_dist.py checks both distributions in CI.
[tool.hatch.build.targets.sdist]
only-include = ["src/inklight", "hatch_build.py", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ocr: needs the Inklight OCR models (downloaded on first use)",
  "models: needs the Inklight small models (`inklight models pull`)",
  "structure: needs the structure runtime and models (`pip install \"inklight[structure]\"`)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Model code taken from its upstream projects, kept as close to them as possible so it can be compared line by line.
extend-exclude = ["src/inklight/backends/ocr/*.py", "src/inklight/backends/structure/tableformer", "src/inklight/backends/structure/datamodel.py", "src/inklight/backends/structure/layout_postprocessor.py", "src/inklight/backends/structure/assemble.py", "src/inklight/backends/structure/reading_order.py", "src/inklight/backends/structure/reading_order_rb.py", "src/inklight/backends/structure/list_markers.py", "src/inklight/backends/structure/form_fields.py", "src/inklight/backends/structure/spatial.py", "src/inklight/backends/structure/tables.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"bench/*" = ["S"]
"evaluation/report/build.py" = ["E501"]  # SVG markup in strings
".github/scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["inklight.backends.ocr.*", "inklight.backends.structure.tableformer.*", "inklight.backends.structure.datamodel", "inklight.backends.structure.layout_postprocessor", "inklight.backends.structure.assemble", "inklight.backends.structure.reading_order", "inklight.backends.structure.reading_order_rb", "inklight.backends.structure.list_markers", "inklight.backends.structure.form_fields", "inklight.backends.structure.spatial", "inklight.backends.structure.tables"]
ignore_errors = true
follow_imports = "skip"

[tool.coverage.run]
source = ["inklight"]
omit = ["src/inklight/server/*", "src/inklight/__main__.py", "src/inklight/backends/*"]
