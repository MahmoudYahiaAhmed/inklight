[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inklight"
version = "0.1.0"
description = "Inklight — a local-first, OCR-powered document agent. See documents. Understand meaning. Take action."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.11"
authors = [{ name = "Mahmoud AboEl-Wfa" }]
maintainers = [{ name = "Mahmoud AboEl-Wfa" }]
keywords = ["ocr", "document-ai", "agent", "pdf", "extraction", "rag", "invoice", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing :: General",
  "Typing :: Typed",
]
dependencies = [
  "indra-ocr>=1.1",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13",
  "tokenizers>=0.19",
  "numpy>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
remote = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "pymupdf>=1.24"]

[project.scripts]
inklight = "inklight.cli:main"

[project.urls]
Homepage = "https://github.com/MahmoudYahiaAhmed/inklight"
Documentation = "https://github.com/MahmoudYahiaAhmed/inklight/tree/main/docs"
Issues = "https://github.com/MahmoudYahiaAhmed/inklight/issues"
Changelog = "https://github.com/MahmoudYahiaAhmed/inklight/blob/main/CHANGELOG.md"
Source = "https://github.com/MahmoudYahiaAhmed/inklight"

[tool.hatch.build.targets.wheel]
packages = ["src/inklight"]

[tool.hatch.build.targets.sdist]
include = ["src/inklight", "tests", "docs", "README.md", "LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ocr: needs the Indra OCR models (downloaded on first use)",
  "models: needs the Inklight small models (`inklight models pull`)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"bench/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["inklight"]
omit = ["src/inklight/server/*", "src/inklight/__main__.py"]
